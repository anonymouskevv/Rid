<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Riddles</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  background: radial-gradient(circle at top, #0b1d2b, #000);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  color: #fff;
}

.wrapper {
  width: 100%;
  height: 100%;
  max-width: 720px;
  aspect-ratio: 9 / 16;
  padding: 30px 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.header {
  text-align: center;
}

.header h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: 3.2rem;
  color: #00f6ff;
  text-shadow: 0 0 25px rgba(0,255,255,0.7);
  letter-spacing: 3px;
}

.header p {
  margin-top: 6px;
  font-size: 1.2rem;
  opacity: 0.85;
}

.riddle-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}

.riddle {
  font-size: 3.2rem;
  font-weight: 700;
  text-align: center;
  line-height: 1.3;
  text-shadow: 0 0 18px rgba(255,255,255,0.25);
  animation: pop 0.8s ease;
}

@keyframes pop {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.notice {
  font-size: 1.1rem;
  color: #00ffd5;
  animation: blink 1.2s infinite;
}

.timer {
  font-family: 'Orbitron', sans-serif;
  font-size: 2.4rem;
  color: #00fff0;
  text-shadow: 0 0 15px rgba(0,255,240,0.8);
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="header">
    <h1>LIVE RIDDLES</h1>
    <p>Think fast • Type answer • Stay sharp</p>
  </div>

  <div class="riddle-area">
    <div id="riddle" class="riddle">Loading…</div>
  </div>

  <div class="footer">
    <div class="notice">New riddle every 90 sec</div>
    <div id="timer" class="timer">01:30</div>
  </div>
</div>

<script>
let riddles = [];
const DURATION = 90;
let timeLeft = DURATION;

async function loadRiddles() {
  const res = await fetch('riddles.txt');
  const text = await res.text();
  riddles = text.split('\n').map(r => r.trim()).filter(Boolean);
  changeRiddle();
}

function changeRiddle() {
  const r = riddles[Math.floor(Math.random() * riddles.length)];
  const el = document.getElementById('riddle');
  el.style.opacity = 0;
  setTimeout(() => {
    el.textContent = r;
    el.style.opacity = 1;
  }, 200);
  timeLeft = DURATION;
}

setInterval(() => {
  timeLeft--;
  if (timeLeft <= 0) changeRiddle();
  const m = String(Math.floor(timeLeft / 60)).padStart(2,'0');
  const s = String(timeLeft % 60).padStart(2,'0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}, 1000);

loadRiddles();
</script>

</body>
</html>
