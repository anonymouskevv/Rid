<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
<title>Live Riddles</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 1080px;
  height: 1920px;
  background: #050608;
  font-family: 'Montserrat', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #ffffff;
  overflow: hidden;
}

/* Fixed 1080x1920 stage */
.stage {
  width: 1080px;
  height: 1920px;
  padding: 60px;
  display: flex;
  flex-direction: column;
}

/* Glass card */
.card {
  flex: 1;
  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.06),
    rgba(255,255,255,0.02)
  );
  border-radius: 42px;
  padding: 80px 70px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}

/* Animated border */
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 42px;
  padding: 3px;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.7),
    transparent
  );
  animation: borderMove 6s linear infinite;
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
          mask-composite: exclude;
}

@keyframes borderMove {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* Header */
.header {
  text-align: center;
}

.header h1 {
  font-size: 92px;
  font-weight: 900;
  letter-spacing: 6px;
}

.header p {
  margin-top: 14px;
  font-size: 30px;
  opacity: 0.75;
}

/* Riddle */
.riddle-box {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.riddle {
  font-size: 110px;
  font-weight: 700;
  text-align: center;
  line-height: 1.2;
  animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Footer */
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.label {
  font-size: 28px;
  opacity: 0.7;
}

.timer {
  font-size: 96px;
  font-weight: 900;
  letter-spacing: 3px;
}

.urgent {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.5; }
  100% { opacity: 1; }
}
</style>
</head>

<body>

<div class="stage">
  <div class="card">

    <div class="header">
      <h1>LIVE RIDDLES</h1>
      <p>Think fast • Type the answer</p>
    </div>

    <div class="riddle-box">
      <div id="riddle" class="riddle">Loading…</div>
    </div>

    <div class="footer">
      <div class="label">New riddle every 90s</div>
      <div id="timer" class="timer">01:30</div>
    </div>

  </div>
</div>

<script>
let riddles = [];
const DURATION = 90;
let timeLeft = DURATION;

async function loadRiddles() {
  const res = await fetch('riddles.txt');
  const text = await res.text();
  riddles = text.split('\n').map(r => r.trim()).filter(Boolean);
  nextRiddle();
}

function nextRiddle() {
  const el = document.getElementById('riddle');
  const r = riddles[Math.floor(Math.random() * riddles.length)];
  el.style.opacity = 0;
  setTimeout(() => {
    el.textContent = r;
    el.style.opacity = 1;
  }, 200);
  timeLeft = DURATION;
}

setInterval(() => {
  timeLeft--;
  if (timeLeft <= 0) nextRiddle();

  const m = String(Math.floor(timeLeft / 60)).padStart(2,'0');
  const s = String(timeLeft % 60).padStart(2,'0');
  const timerEl = document.getElementById('timer');
  timerEl.textContent = `${m}:${s}`;

  if (timeLeft <= 10) {
    timerEl.classList.add('urgent');
  } else {
    timerEl.classList.remove('urgent');
  }
}, 1000);

loadRiddles();
</script>

</body>
</html>
