<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Riddles • 24/7</title>  <!-- Fonts -->  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #0b0f1a, #000);
      font-family: 'Poppins', sans-serif;
      color: #e9faff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* VERTICAL FRAME (9:16) */
    .frame {
      width: 390px;
      height: 780px;
      max-height: 95vh;
      background: rgba(255,255,255,0.04);
      border-radius: 32px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 0 80px rgba(0,255,255,0.18);
      backdrop-filter: blur(18px);
      animation: pulseGlow 6s infinite alternate;
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 40px rgba(0,255,255,0.12); }
      to { box-shadow: 0 0 90px rgba(0,255,255,0.28); }
    }

    /* HEADER */
    .header {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 3px;
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .sub {
      font-size: 0.7rem;
      letter-spacing: 2px;
      opacity: 0.5;
      margin-top: 4px;
    }

    /* VISUALIZER PLACEHOLDER */
    .visual {
      height: 110px;
      margin: 18px 0 10px;
      background: linear-gradient(90deg, rgba(0,255,255,0.2), rgba(0,255,255,0.05), rgba(0,255,255,0.2));
      border-radius: 18px;
      animation: moveBg 6s linear infinite;
    }

    @keyframes moveBg {
      from { background-position: 0% 50%; }
      to { background-position: 200% 50%; }
    }

    /* RIDDLE AREA */
    .riddle-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      font-size: 1.35rem;
      line-height: 1.6;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    /* TIMER */
    .timer {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 2.6rem;
      color: #7fffd4;
      text-shadow: 0 0 12px rgba(127,255,212,0.8);
    }

    .timer-label {
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 3px;
      opacity: 0.5;
      margin-top: 6px;
    }

    /* FOOTER */
    .footer {
      text-align: center;
      font-size: 0.65rem;
      opacity: 0.4;
      margin-top: 12px;
    }
  </style></head>
<body>  <div class="frame"><div class="header">
  LIVE RIDDLES
  <div class="sub">SOLVE • CHAT • STAY</div>
</div>

<div class="visual"></div>

<div class="riddle-box" id="riddle">Loading riddles…</div>

<div>
  <div class="timer" id="timer">05:00</div>
  <div class="timer-label">NEXT RIDDLE IN</div>
</div>

<div class="footer">Answer in chat 👇</div>

  </div>  <script>
    const DURATION = 300; // 5 minutes
    let timeLeft = DURATION;
    let riddles = [];
    let index = 0;

    const riddleEl = document.getElementById('riddle');
    const timerEl = document.getElementById('timer');

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function showRiddle() {
      riddleEl.style.opacity = 0;
      riddleEl.style.transform = 'translateY(10px)';

      setTimeout(() => {
        riddleEl.textContent = riddles[index];
        riddleEl.style.opacity = 1;
        riddleEl.style.transform = 'translateY(0)';
        index = (index + 1) % riddles.length;
      }, 600);

      timeLeft = DURATION;
    }

    setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) showRiddle();
      timerEl.textContent = formatTime(timeLeft);
    }, 1000);

    fetch('riddles.txt')
      .then(r => r.text())
      .then(t => {
        riddles = t.split('\n').map(x => x.trim()).filter(Boolean);
        if (!riddles.length) {
          riddleEl.textContent = 'No riddles found.';
          return;
        }
        showRiddle();
      })
      .catch(() => riddleEl.textContent = 'Failed to load riddles.txt');

  </script></body>
</html>
