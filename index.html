<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Riddles</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  background: linear-gradient(180deg, #0a0c10, #020304);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  color: #ffffff;
}

/* Responsive 9:16 container (same as first good one) */
.wrapper {
  width: 100%;
  height: 100%;
  max-width: 720px;
  aspect-ratio: 9 / 16;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* Main card */
.card {
  flex: 1;
  background: rgba(255,255,255,0.04);
  border-radius: 26px;
  padding: 32px 26px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.08);
}

/* Header */
.header {
  text-align: center;
}

.header h1 {
  font-size: 3.2rem;   /* SAME SIZE FEEL AS FIRST */
  font-weight: 800;
  letter-spacing: 2px;
}

.header p {
  margin-top: 6px;
  font-size: 1.1rem;
  opacity: 0.75;
}

/* Riddle area */
.riddle-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}

.riddle {
  font-size: 3.2rem;   /* SAME AS FIRST WORKING VERSION */
  font-weight: 700;
  text-align: center;
  line-height: 1.3;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.97); }
  to { opacity: 1; transform: scale(1); }
}

/* Footer */
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.notice {
  font-size: 1rem;
  opacity: 0.65;
}

.timer {
  font-size: 2.4rem;  /* SAME AS FIRST */
  font-weight: 800;
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="card">

    <div class="header">
      <h1>LIVE RIDDLES</h1>
      <p>Think fast • Type answer</p>
    </div>

    <div class="riddle-area">
      <div id="riddle" class="riddle">Loading…</div>
    </div>

    <div class="footer">
      <div class="notice">New riddle every 90 seconds</div>
      <div id="timer" class="timer">01:30</div>
    </div>

  </div>
</div>

<script>
let riddles = [];
const DURATION = 90;
let remaining = DURATION;

async function loadRiddles() {
  const res = await fetch('riddles.txt');
  const text = await res.text();
  riddles = text.split('\n').map(r => r.trim()).filter(Boolean);
  showRiddle();
}

function showRiddle() {
  const el = document.getElementById('riddle');
  const r = riddles[Math.floor(Math.random() * riddles.length)];
  el.style.opacity = 0;
  setTimeout(() => {
    el.textContent = r;
    el.style.opacity = 1;
  }, 200);
  remaining = DURATION;
}

setInterval(() => {
  remaining--;
  if (remaining <= 0) showRiddle();
  const m = String(Math.floor(remaining / 60)).padStart(2, '0');
  const s = String(remaining % 60).padStart(2, '0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}, 1000);

loadRiddles();
</script>

</body>
</html>
