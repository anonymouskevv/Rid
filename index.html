<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24/7 Math Riddle Live</title>  <!-- Fonts -->  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #14001f, #040008);
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Vertical 9:16 Frame */
    .frame {
      width: 440px;
      height: 880px;
      max-height: 96vh;
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
      border-radius: 40px;
      padding: 30px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(24px);
      box-shadow:
        0 0 70px rgba(255, 0, 255, 0.35),
        0 0 140px rgba(0, 255, 255, 0.25);
      animation: glowPulse 9s infinite alternate;
    }

    @keyframes glowPulse {
      from {
        box-shadow:
          0 0 50px rgba(255, 0, 255, 0.35),
          0 0 100px rgba(0, 255, 255, 0.25);
      }
      to {
        box-shadow:
          0 0 100px rgba(255, 0, 255, 0.55),
          0 0 180px rgba(0, 255, 255, 0.35);
      }
    }

    /* Header */
    .header {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 4px;
      color: #ff86ff;
      text-shadow: 0 0 14px rgba(255,134,255,0.9);
    }

    .sub {
      font-size: 0.85rem;
      letter-spacing: 3px;
      margin-top: 6px;
      color: #bfffff;
      opacity: 0.75;
    }

    /* Visualizer Bar */
    .visual {
      height: 140px;
      margin: 24px 0 16px;
      border-radius: 24px;
      background: linear-gradient(
        90deg,
        rgba(255,0,255,0.4),
        rgba(0,255,255,0.3),
        rgba(255,0,255,0.4)
      );
      background-size: 300% 300%;
      animation: waveMove 7s linear infinite;
      box-shadow: inset 0 0 30px rgba(255,255,255,0.25);
    }

    @keyframes waveMove {
      0% { background-position: 0% 50%; }
      100% { background-position: 300% 50%; }
    }

    /* Riddle Box */
    .riddle-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-size: 1.8rem;
      font-weight: 600;
      line-height: 1.65;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255,255,255,0.35);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    /* Timer */
    .timer {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 3.6rem;
      color: #7dfff2;
      text-shadow: 0 0 20px rgba(125,255,242,1);
    }

    .timer-label {
      text-align: center;
      font-size: 0.8rem;
      letter-spacing: 4px;
      margin-top: 6px;
      color: #e0ffff;
      opacity: 0.65;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #ffffff;
      opacity: 0.5;
      margin-top: 14px;
    }
  </style></head>
<body>  <div class="frame"><div class="header">
  MATH RIDDLES LIVE
  <div class="sub">THINK • SOLVE • TYPE</div>
</div>

<div class="visual"></div>

<div class="riddle-box" id="riddle">Loading riddles…</div>

<div>
  <div class="timer" id="timer">01:30</div>
  <div class="timer-label">NEXT RIDDLE IN</div>
</div>

<div class="footer">Solve it in chat 👇 New puzzle every 90 seconds</div>

  </div>  <script>
    /* CHANGE THIS VALUE IF NEEDED
       90 = 1.5 minutes
       120 = 2 minutes */
    const DURATION = 90;

    let timeLeft = DURATION;
    let riddles = [];
    let index = 0;

    const riddleEl = document.getElementById('riddle');
    const timerEl = document.getElementById('timer');

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function showRiddle() {
      riddleEl.style.opacity = 0;
      riddleEl.style.transform = 'translateY(16px)';

      setTimeout(() => {
        riddleEl.textContent = riddles[index];
        riddleEl.style.opacity = 1;
        riddleEl.style.transform = 'translateY(0)';
        index = (index + 1) % riddles.length;
      }, 700);

      timeLeft = DURATION;
    }

    setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) showRiddle();
      timerEl.textContent = formatTime(timeLeft);
    }, 1000);

    fetch('riddles.txt')
      .then(res => res.text())
      .then(text => {
        riddles = text.split('\n').map(r => r.trim()).filter(Boolean);
        if (!riddles.length) {
          riddleEl.textContent = 'No riddles found.';
          return;
        }
        showRiddle();
      })
      .catch(() => {
        riddleEl.textContent = 'Failed to load riddles.txt';
      });
  </script></body>
</html>
