<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Riddles</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  background: radial-gradient(circle at top, #111827, #020204);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
  color: #fff;
}

/* SAME SAFE CONTAINER AS FIRST VERSION */
.wrapper {
  width: 100%;
  height: 100%;
  max-width: 720px;
  aspect-ratio: 9 / 16;
  padding: 28px 22px;
  display: flex;
}

/* MAIN CARD */
.card {
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.05);
  border-radius: 28px;
  padding: 34px 26px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(8px);
}

/* HEADER */
.header {
  text-align: center;
}

.header h1 {
  font-size: 3.2rem;
  font-weight: 800;
  letter-spacing: 2px;
}

.header p {
  margin-top: 8px;
  font-size: 1.25rem;
  opacity: 0.75;
}

/* RIDDLE */
.riddle-box {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
}

.riddle {
  font-size: 3.2rem;
  font-weight: 700;
  line-height: 1.35;
  text-align: center;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

/* FOOTER */
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* 🔥 MADE BIG AS REQUESTED */
.notice {
  font-size: 1.6rem;
  font-weight: 600;
  opacity: 0.85;
}

/* TIMER */
.timer {
  font-size: 2.6rem;
  font-weight: 800;
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="card">

    <div class="header">
      <h1>LIVE RIDDLES</h1>
      <p>Think fast • Type answer</p>
    </div>

    <div class="riddle-box">
      <div id="riddle" class="riddle">Loading riddle…</div>
    </div>

    <div class="footer">
      <div class="notice">Next riddle in 90 seconds</div>
      <div id="timer" class="timer">01:30</div>
    </div>

  </div>
</div>

<script>
let riddles = [];
const INTERVAL = 90;
let timeLeft = INTERVAL;

async function loadRiddles() {
  const res = await fetch("riddles.txt");
  const text = await res.text();
  riddles = text.split("\n").map(r => r.trim()).filter(Boolean);
  showRiddle();
}

function showRiddle() {
  const el = document.getElementById("riddle");
  el.style.opacity = 0;

  setTimeout(() => {
    el.textContent = riddles[Math.floor(Math.random() * riddles.length)];
    el.style.opacity = 1;
  }, 200);

  timeLeft = INTERVAL;
}

setInterval(() => {
  timeLeft--;
  if (timeLeft <= 0) showRiddle();

  const m = String(Math.floor(timeLeft / 60)).padStart(2, "0");
  const s = String(timeLeft % 60).padStart(2, "0");
  document.getElementById("timer").textContent = `${m}:${s}`;
}, 1000);

loadRiddles();
</script>

</body>
</html>
