<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>24/7 Math Riddle Live</title>  <!-- Fonts -->  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      background:
        radial-gradient(circle at top, #ff0080, #12001f 60%, #000000 100%);
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Vertical 9:16 Frame */
    .frame {
      width: 460px;
      height: 900px;
      max-height: 97vh;
      background: linear-gradient(180deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
      border-radius: 42px;
      padding: 34px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      backdrop-filter: blur(26px);
      box-shadow:
        0 0 80px rgba(255, 0, 128, 0.45),
        0 0 160px rgba(0, 255, 255, 0.35);
      animation: glowPulse 10s infinite alternate;
    }

    @keyframes glowPulse {
      from {
        box-shadow:
          0 0 60px rgba(255, 0, 128, 0.45),
          0 0 120px rgba(0, 255, 255, 0.35);
      }
      to {
        box-shadow:
          0 0 120px rgba(255, 0, 128, 0.75),
          0 0 220px rgba(0, 255, 255, 0.55);
      }
    }

    /* Header */
    .header {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.9rem;
      letter-spacing: 5px;
      color: #ffffff;
      text-shadow:
        0 0 15px #ff0080,
        0 0 30px #00ffff;
    }

    .sub {
      font-size: 0.95rem;
      letter-spacing: 3px;
      margin-top: 8px;
      color: #ffe6f2;
      opacity: 0.85;
    }

    /* Riddle Box */
    .riddle-box {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.7;
      color: #ffffff;
      text-shadow:
        0 0 10px rgba(255,255,255,0.4),
        0 0 25px rgba(255,0,128,0.6);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    /* Timer */
    .timer {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 4rem;
      font-weight: 800;
      color: #00ffff;
      text-shadow:
        0 0 20px rgba(0,255,255,1),
        0 0 40px rgba(255,0,128,0.8);
    }

    .timer-label {
      text-align: center;
      font-size: 0.9rem;
      letter-spacing: 4px;
      margin-top: 8px;
      color: #ffffff;
      opacity: 0.7;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: #ffffff;
      opacity: 0.6;
      margin-top: 16px;
    }
  </style></head>
<body>  <div class="frame"><div class="header">
  LIVE MATH PUZZLES
  <div class="sub">THINK FAST • TYPE ANSWER</div>
</div>

<div class="riddle-box" id="riddle">Loading puzzles…</div>

<div>
  <div class="timer" id="timer">01:30</div>
  <div class="timer-label">NEXT PUZZLE IN</div>
</div>

<div class="footer">New puzzle every 90 seconds • Stay & solve 👇</div>

  </div>  <script>
    /* CHANGE THIS VALUE IF NEEDED
       90 = 1.5 minutes
       120 = 2 minutes */
    const DURATION = 90;

    let timeLeft = DURATION;
    let riddles = [];
    let index = 0;

    const riddleEl = document.getElementById('riddle');
    const timerEl = document.getElementById('timer');

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function showRiddle() {
      riddleEl.style.opacity = 0;
      riddleEl.style.transform = 'translateY(18px)';

      setTimeout(() => {
        riddleEl.textContent = riddles[index];
        riddleEl.style.opacity = 1;
        riddleEl.style.transform = 'translateY(0)';
        index = (index + 1) % riddles.length;
      }, 600);

      timeLeft = DURATION;
    }

    setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) showRiddle();
      timerEl.textContent = formatTime(timeLeft);
    }, 1000);

    fetch('riddles.txt')
      .then(res => res.text())
      .then(text => {
        riddles = text.split('\n').map(r => r.trim()).filter(Boolean);
        if (!riddles.length) {
          riddleEl.textContent = 'No puzzles found.';
          return;
        }
        showRiddle();
      })
      .catch(() => {
        riddleEl.textContent = 'Failed to load riddles.txt';
      });
  </script></body>
</html>
