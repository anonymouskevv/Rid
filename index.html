<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Riddles</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100vw;
  height: 100vh;
  background: #0f1115;
  font-family: 'Inter', sans-serif;
  color: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
}

.frame {
  width: 100%;
  height: 100%;
  max-width: 720px;
  aspect-ratio: 9 / 16;
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: #0f1115;
}

.header {
  text-align: center;
}

.header h1 {
  font-size: 3rem;
  font-weight: 800;
  letter-spacing: 1px;
}

.header p {
  margin-top: 6px;
  font-size: 1.1rem;
  color: #b8b8b8;
}

.riddle-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.riddle {
  font-size: 3.4rem;
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
  max-width: 100%;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.label {
  font-size: 1rem;
  color: #9aa0a6;
}

.timer {
  font-size: 2.6rem;
  font-weight: 700;
  color: #ffffff;
}
</style>
</head>

<body>

<div class="frame">

  <div class="header">
    <h1>LIVE RIDDLES</h1>
    <p>Think fast • Type answer</p>
  </div>

  <div class="riddle-wrap">
    <div id="riddle" class="riddle">Loading…</div>
  </div>

  <div class="footer">
    <div class="label">New riddle every 90s</div>
    <div id="timer" class="timer">01:30</div>
  </div>

</div>

<script>
let riddles = [];
const DURATION = 90;
let timeLeft = DURATION;

async function loadRiddles() {
  const res = await fetch('riddles.txt');
  const text = await res.text();
  riddles = text.split('\n').map(r => r.trim()).filter(Boolean);
  nextRiddle();
}

function nextRiddle() {
  const el = document.getElementById('riddle');
  const r = riddles[Math.floor(Math.random() * riddles.length)];
  el.style.opacity = 0;
  setTimeout(() => {
    el.textContent = r;
    el.style.opacity = 1;
  }, 200);
  timeLeft = DURATION;
}

setInterval(() => {
  timeLeft--;
  if (timeLeft <= 0) nextRiddle();
  const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
  const s = String(timeLeft % 60).padStart(2, '0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}, 1000);

loadRiddles();
</script>

</body>
</html>
